<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agregar Contacto</title>
    <style>
        .contact-button {
            background-color: #4CAF50;
            border: none;
            color: white;
            padding: 15px 32px;
            text-align: center;
            text-decoration: none;
            display: inline-block;
            font-size: 16px;
            margin: 4px 2px;
            cursor: pointer;
            border-radius: 8px;
            transition: background-color 0.3s;
        }
        
        .contact-button:hover {
            background-color: #45a049;
        }
    </style>
</head>
<body>
    <h2>Agregar contacto de ventas</h2>
    
    <button class="contact-button" onclick="downloadVCard()">
        Agregar a Juan (Ventas) a tus contactos
    </button>

    <script>
        function downloadVCard() {
            // Datos del contacto
            const contact = {
                firstName: 'Juan',
                lastName: 'Ventas',
                phone: '960600911',
                organization: 'Ventas',
                note: 'Contacto de ventas'
            };

            // Crear contenido VCF
            const vCardContent = [
                'BEGIN:VCARD',
                'VERSION:3.0',
                `FN:${contact.firstName} ${contact.lastName}`,
                `N:${contact.lastName};${contact.firstName};;;`,
                `TEL;TYPE=WORK,VOICE:${contact.phone}`,
                `ORG:${contact.organization}`,
                `NOTE:${contact.note}`,
                'END:VCARD'
            ].join('\n');

            // Crear blob y enlace de descarga
            const blob = new Blob([vCardContent], { type: 'text/vcard' });
            const url = URL.createObjectURL(blob);
            
            // Crear elemento <a> invisible para la descarga
            const a = document.createElement('a');
            a.style.display = 'none';
            a.href = url;
            a.download = `${contact.firstName}_${contact.lastName}.vcf`;
            
            // Añadir al documento y hacer clic
            document.body.appendChild(a);
            a.click();
            
            // Limpiar
            setTimeout(() => {
                document.body.removeChild(a);
                window.URL.revokeObjectURL(url);
            }, 100);
        }
    </script>
</body>
</html>
